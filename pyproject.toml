[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-3d-room-mapper"
version = "0.1.0"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
